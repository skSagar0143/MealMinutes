spring:
  application:
    name: mealminutes-api
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/mealminutes_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}"
    username: ${DB_USERNAME:mealminutes_app}
    password: ${DB_PASSWORD:local_dev_only_change_me}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

mealminutes:
  tenant-datasource:
    standalone-enabled: ${MEALMINUTES_TENANT_DATASOURCE_STANDALONE_ENABLED:false}
    jdbc-url-template: "${TENANT_JDBC_URL_TEMPLATE:jdbc:mysql://localhost:3306/{database}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}"
    max-pool-count: ${TENANT_DB_MAX_POOLS:20}
    max-pool-size-per-tenant: ${TENANT_DB_POOL_SIZE:5}
    min-idle-per-tenant: ${TENANT_DB_MIN_IDLE:0}
    connection-timeout-ms: ${TENANT_DB_CONNECTION_TIMEOUT_MS:3000}
    idle-timeout-ms: ${TENANT_DB_IDLE_TIMEOUT_MS:60000}
  tenant-provisioning:
    enabled: ${MEALMINUTES_TENANT_PROVISIONING_ENABLED:false}
    admin-jdbc-url: ${TENANT_DB_ADMIN_JDBC_URL:}
    admin-username: ${TENANT_DB_ADMIN_USERNAME:}
    admin-password: ${TENANT_DB_ADMIN_PASSWORD:}
    local-secret-file: ${MEALMINUTES_LOCAL_SECRET_FILE:./.local-secrets/tenant-db-secrets.properties}
    local-secret-key: ${MEALMINUTES_LOCAL_SECRET_KEY:}
    migration-location: classpath:db/tenant-migration
  security:
    enabled: ${MEALMINUTES_SECURITY_ENABLED:false}
    private-key-location: ${MEALMINUTES_RSA_PRIVATE_KEY_LOCATION:}
    public-key-location: ${MEALMINUTES_RSA_PUBLIC_KEY_LOCATION:}
    issuer: ${MEALMINUTES_JWT_ISSUER:https://mealminutes.local}
    access-token-ttl-seconds: ${MEALMINUTES_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${MEALMINUTES_REFRESH_TOKEN_TTL_SECONDS:2592000}
    refresh-cookie-secure: ${MEALMINUTES_REFRESH_COOKIE_SECURE:true}
    allowed-origin: ${MEALMINUTES_ALLOWED_ORIGIN:http://localhost:5173}

  payment:
    enabled: ${MEALMINUTES_PAYMENT_ENABLED:false}
    razorpay:
      key-id: ${MEALMINUTES_RAZORPAY_KEY_ID:}
      key-secret: ${MEALMINUTES_RAZORPAY_KEY_SECRET:}
      webhook-secret: ${MEALMINUTES_RAZORPAY_WEBHOOK_SECRET:}
      api-base-url: ${MEALMINUTES_RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}

  order-pricing:
    enabled: ${MEALMINUTES_ORDER_PRICING_ENABLED:false}
    tax-rate: ${MEALMINUTES_ORDER_TAX_RATE:0.00}
    delivery-fee: ${MEALMINUTES_ORDER_DELIVERY_FEE:0.00}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

info:
  app:
    name: MealMinutes API
    description: Multi-tenant restaurant platform API
