name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mealminutes-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mealminutes_platform
          MYSQL_USER: mealminutes_app
          MYSQL_PASSWORD: local_dev_only_change_me
          MYSQL_ROOT_PASSWORD: local_root_only_change_me
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal_root_only_change_me --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests and JaCoCo report
        env:
          TENANT_TEST_ADMIN_JDBC_URL: jdbc:mysql://127.0.0.1:3306/mysql?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
          TENANT_TEST_JDBC_URL_TEMPLATE: jdbc:mysql://127.0.0.1:3306/{database}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
          TENANT_TEST_ADMIN_USERNAME: root
          TENANT_TEST_ADMIN_PASSWORD: local_root_only_change_me
        run: mvn -B -f backend/pom.xml verify
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn
