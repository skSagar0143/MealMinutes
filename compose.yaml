services:
  mysql:
    image: mysql:8.4
    container_name: mealminutes-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mealminutes_platform}
      MYSQL_USER: ${MYSQL_USER:-mealminutes_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_dev_only_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_only_change_me}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mealminutes-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:8-alpine
    container_name: mealminutes-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - mealminutes-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mealminutes-mysql-data:
  mealminutes-redis-data:
